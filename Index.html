<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="monetag" content="b376d14b420efdaa82ad06a621749ccd">
    <title>Vibeslight - Controle Sua Ansiedade</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Arial', sans-serif; 
            background: #0a0a0a; 
            color: #fff; 
            text-align: center; 
            overflow-x: hidden;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        h1 { font-size: 28px; margin: 20px 0; color: #FF6B00; }
        .balanca { 
            width: 200px; 
            height: 200px; 
            margin: 30px auto; 
            position: relative;
            animation: tremer 0.5s infinite alternate;
        }
        @keyframes tremer {
            0% { transform: rotate(-3deg); }
            100% { transform: rotate(3deg); }
        }
        .ponteiro {
            width: 4px;
            height: 80px;
            background: #FF0000;
            position: absolute;
            left: 50%;
            top: 20px;
            transform-origin: bottom;
            animation: oscilar 2s ease-in-out infinite;
        }
        @keyframes oscilar {
            0%, 100% { transform: translateX(-50%) rotate(-20deg); }
            50% { transform: translateX(-50%) rotate(20deg); }
        }
        .deterioracao {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 60%, rgba(255,0,0,0.3) 100%);
            animation: pulsar 2s infinite;
            opacity: 0;
        }
        @keyframes pulsar {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
        .timer {
            font-size: 48px;
            color: #FF6B00;
            margin: 20px 0;
            font-weight: bold;
        }
        .cta {
            background: #FF6B00;
            color: #000;
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 30px 0;
            text-decoration: none;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="deterioracao" id="deterioracao"></div>
    <div class="container">
        <h1>SUA ANSIEDADE ESTÁ SAINDO DO CONTROLE</h1>
        
        <div class="balanca">
            <svg viewBox="0 0 200 200" style="width:100%">
                <circle cx="100" cy="100" r="90" fill="none" stroke="#333" stroke-width="10"/>
                <circle cx="100" cy="100" r="90" fill="none" stroke="#FF0000" stroke-width="10" stroke-dasharray="565" stroke-dashoffset="141" stroke-linecap="round"/>
            </svg>
            <div class="ponteiro" id="ponteiro"></div>
        </div>

        <div class="timer" id="timer">2</div>
        <p style="margin-bottom:20px">Segundos para sua mente travar</p>

        <a href="https://omg10.com/4/11025748" class="cta">
            QUERO CONTROLAR MINHA ANSIEDADE AGORA
        </a>
        
        <p style="font-size:12px;opacity:0.6">Zones ativas: 11020715 - Popunder, 11020720 - Interstitial</p>
    </div>

    <script>
        let tempo = 2;
        const timerEl = document.getElementById('timer');
        const deterioracao = document.getElementById('deterioracao');
        
        const contagem = setInterval(() => {
            tempo--;
            timerEl.textContent = tempo;
            
            if(tempo <= 0) {
                clearInterval(contagem);
                timerEl.textContent = "AGORA";
                deterioracao.style.opacity = "1";
            }
        }, 1000);

        setTimeout(() => {
            deterioracao.style.opacity = "1";
        }, 500);
    </script>
</body>
        </html>
