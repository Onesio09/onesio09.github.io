<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp</title>
    <meta name="facebook-domain-verification" content="SEU_CODIGO_AQUI" />
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px 20px; background: #f0f2f5; }
        .btn { 
            background: #25D366; color: white; padding: 15px 30px; 
            border: none; border-radius: 8px; font-size: 18px; 
            cursor: pointer; margin-top: 20px; text-decoration: none; display: inline-block;
        }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #25D366; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h2>Aguarde...</h2>
    <div class="loader"></div>
    <p>Estamos te conectando com um atendente.</p>
    
    <!-- BOTÃO QUE ABRE O DIRECT LINK -->
    <a href="https://omg10.com/4/11033986" target="_blank" class="btn" id="continuar">Continuar para WhatsApp</a>

    <!-- REDIRECT AUTOMÁTICO DEPOIS DE 6 SEGUNDOS -->
    <script>
        // Se clicar no botão, abre o Direct Link e redireciona pro WhatsApp
        document.getElementById('continuar').addEventListener('click', function(){
            setTimeout(function(){
                window.location.href = "https://wa.me/55SEUNUMERO?text=Olá";
            }, 1000);
        });

        // Se não clicar, redireciona automático em 6s
        setTimeout(function(){
            window.location.href = "https://wa.me/55SEUNUMERO?text=Olá";
        }, 6000);
    </script>

    <!-- MONETAG POPUNDER -->
    <script>(function(s){s.dataset.zone='11033978',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

    <!-- MONETAG VIGNETTE -->
    <script>(function(s){s.dataset.zone='11033982',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
</body>
</html>
