<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liberdade Financeira</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    text-align:center;
}

.container{
    max-width:500px;
    margin:auto;
    padding:20px;
}

.card{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);
    padding:25px;
    border-radius:16px;
    margin-top:40px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

h1{
    font-size:26px;
    margin-bottom:10px;
}

.sub{
    font-size:15px;
    color:#cbd5e1;
    margin-bottom:20px;
}

.badge{
    display:inline-block;
    background:#22c55e;
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    margin-bottom:15px;
}

.timer{
    font-size:22px;
    font-weight:bold;
    color:#facc15;
    margin:15px 0;
}

.btn{
    display:block;
    width:100%;
    padding:16px;
    background:#22c55e;
    color:white;
    text-decoration:none;
    font-size:17px;
    font-weight:bold;
    border-radius:12px;
    margin-top:15px;
}

.btn:hover{
    opacity:0.9;
}

.hidden{
    display:none;
}

.small{
    font-size:12px;
    color:#94a3b8;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="badge">Educação Financeira</div>

        <h1>Aprenda a Melhorar sua Renda</h1>

        <p class="sub">
            Estratégias simples que muitas pessoas estão a usar para começar a organizar e aumentar a sua renda online.
        </p>

        <div class="timer" id="timer">
            Aguarde 5 segundos...
        </div>

        <a id="cta" class="btn hidden" href="https://exemplo.com">
            QUERO ACESSAR AGORA
        </a>

        <p class="small">
            *Conteúdo educativo. Resultados variam de pessoa para pessoa.
        </p>

    </div>

</div>

<script>
let tempo = 5;
const timer = document.getElementById("timer");
const botao = document.getElementById("cta");

const contagem = setInterval(() => {

    tempo--;

    if(tempo > 0){
        timer.innerHTML = "Liberando acesso em " + tempo + "s...";
    } else {
        clearInterval(contagem);
        timer.innerHTML = "Acesso liberado!";
        botao.classList.remove("hidden");
    }

},1000);
</script>

</body>
</html>
